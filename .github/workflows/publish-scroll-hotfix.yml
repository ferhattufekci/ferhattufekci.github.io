name: Publish Scroll Hotfix
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  publish:
    name: Publish verified scroll repair
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      ARTIFACT_NAME: scroll-hotfix-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the main repair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up project Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Require the current main source
        run: node scripts/ci/commands.mjs current "$SOURCE_SHA"
      - name: Generate and package the repair
        run: npm run generate && npm run package:pages
      - name: Verify final package bytes
        run: node scripts/ci/commands.mjs artifact
      - name: Publish repair artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .pages-site
          retention-days: 7
          include-hidden-files: true
      - name: Reject a superseded repair
        run: node scripts/ci/commands.mjs current "$SOURCE_SHA"
      - name: Deploy the repair artifact
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          artifact_name: ${{ env.ARTIFACT_NAME }}
      - name: Verify the served release
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/ci/verify-release.mjs "$DEPLOYMENT_URL" .pages-site/build-metadata.json
      - name: Verify public endpoints after deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run verify -- "$DEPLOYMENT_URL" --all --output=work/qa/scroll-hotfix-production.json
