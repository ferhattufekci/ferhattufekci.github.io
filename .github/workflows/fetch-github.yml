name: Fetch GitHub Repos

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    name: Update Published Data
    if: github.repository == 'ferhattufekci/ferhattufekci.github.io' && github.ref == 'refs/heads/main'
    # The job token only reads. Changes leave through a pull request opened with the sync
    # App's token (contents + pull requests write, no bypass, no workflow or admin rights).
    permissions:
      contents: read
    # Pin the runner version to reduce allocation delays in the rolling latest pool.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked project dependencies
        run: npm ci

      - name: Fetch GitHub repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github.js

      - name: Regenerate static SEO fallback content
        run: npm run generate

      - name: Validate generated content
        run: npm run test:unit

      - name: Create sync App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Propose data changes as a pull request
        env:
          SYNC_TOKEN: ${{ steps.app.outputs.token }}
          SYNC_BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: node scripts/ci/sync-pr.mjs github
