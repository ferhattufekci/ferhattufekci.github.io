name: Portfolio quality and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Updates committed with GITHUB_TOKEN do not trigger another push workflow.
  workflow_run:
    workflows: [Fetch Medium Articles, Fetch GitHub Repos]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  quality:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/test-agent-readiness.yml
    with:
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: [quality, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.quality.outputs.tested_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify public endpoints after deployment
        run: |
          git rev-parse HEAD > verification-source.txt
          npm run verify -- https://ferhattufekci.github.io --all --output=verification-production.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: |
            verification-production.json
            verification-source.txt
          retention-days: 14
