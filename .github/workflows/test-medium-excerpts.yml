name: Test Medium Excerpts

on:
  pull_request:
    paths:
      - 'js/medium-excerpt.js'
      - 'scripts/fetch-medium.js'
      - 'scripts/tests/**'
      - 'scripts/package.json'
      - '.github/workflows/test-medium-excerpts.yml'
  push:
    branches: [main]
    paths:
      - 'js/medium-excerpt.js'
      - 'scripts/fetch-medium.js'
      - 'scripts/tests/**'
      - 'scripts/package.json'
      - '.github/workflows/test-medium-excerpts.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: cd scripts && npm test
