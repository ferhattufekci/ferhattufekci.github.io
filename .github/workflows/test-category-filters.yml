name: Test Category Filters
on:
  push:
    paths:
      - 'index.html'
      - 'css/category-filters.css'
      - 'css/animations.css'
      - 'js/category-filter-hints.js'
      - 'js/page-transition-policy.js'
      - 'js/pages-switcher.js'
      - 'scripts/tests/category-filters.test.js'
      - '.github/workflows/test-category-filters.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'css/category-filters.css'
      - 'css/animations.css'
      - 'js/category-filter-hints.js'
      - 'js/page-transition-policy.js'
      - 'js/pages-switcher.js'
      - 'scripts/tests/category-filters.test.js'
      - '.github/workflows/test-category-filters.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/tests/category-filters.test.js
