# .github/workflows/fetch-medium.yml
#
# Medium RSS'ini çekip kategorize eder.
# medium.com/feed/@USERNAME — bot koruması yok, datacenter IP'lerinden çalışır.
name: Fetch Medium Articles

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'    # data/ ve index.html değişikliklerinde döngüyü önle
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    # ubuntu-latest yerine sabit sürüm: GitHub'ın "latest" havuzunda zaman zaman
    # yaşanan runner tahsis (acquisition) gecikmelerini azaltmak için.
    # Bkz: https://github.com/orgs/community/discussions/165287
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install node-fetch
        run: cd scripts && npm install node-fetch@3

      - name: Fetch Medium articles
        run: node scripts/fetch-medium.js

      - name: Regenerate static SEO fallback content
        run: node scripts/build-static-seo.js

      - name: Commit data files
        run: |
          git config --local user.email "ferhattufekci@outlook.com.tr"
          git config --local user.name  "Ferhat Tüfekçi"
          git add data/ index.html

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update Medium articles [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Retry $i failed, waiting..."
            sleep $((i * 3))
          done